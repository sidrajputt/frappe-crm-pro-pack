# Metadata for bench and linters. The package itself is built from setup.py.

[tool.bench.frappe-dependencies]
# Developed and tested on Frappe v15 with Frappe CRM 1.x. Every Frappe API it uses also exists on v16 and
# develop, so newer versions are allowed but have not been tested.
frappe = ">=15.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
